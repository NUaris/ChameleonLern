name: Firmware CI and draft release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  tests:
    name: Host tests and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: SANITIZE=1 scripts/test.sh
      - run: python3 -m py_compile software/script/chameleon_learning.py scripts/build_firmware.py scripts/verify_firmware.py
  firmware:
    name: nRF52840 application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC and newlib
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev
      - run: python3 scripts/build_firmware.py
      - run: python3 scripts/verify_firmware.py build/firmware/chameleon-learning.hex
      - uses: actions/upload-artifact@v4
        with:
          name: nrf52840-application
          if-no-files-found: error
          retention-days: 30
          path: |
            build/firmware/chameleon-learning.hex
            build/firmware/chameleon-learning.bin
            build/firmware/chameleon-learning.elf
            build/firmware/chameleon-learning.map
            build/firmware/manifest.json
            build/firmware/warnings.log
            docs/FLASHING.md
  release:
    name: Draft release for version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nrf52840-application
          path: release-artifacts
      - name: Create or refresh draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft > /tmp/chameleon-release.json; then
            python3 -c 'import json; assert json.load(open("/tmp/chameleon-release.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --target "$GITHUB_SHA" --title "ChameleonLern $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
          fi
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
